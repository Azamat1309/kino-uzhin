<!DOCTYPE html>
<html lang="ru" data-theme="len">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кино и ужин">
<meta name="theme-color" content="#3a0e18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Кино и ужин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--vel:#3a0e18;--vel2:#2b0a12;--ink:#f6e7c8;--gold:#e8b04a;--gold2:#ffd27a;--board:#151112;--paper:#f3e2c2;--dark:#2b0b12;--mute:#c9a77c;--line:#8a5a3a;--soft:#d9c3a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--vel);color:var(--ink);font-family:'PT Serif',Georgia,serif}
body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px);background-color:var(--vel);background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0,rgba(0,0,0,0) 9px,rgba(255,255,255,.035) 14px,rgba(0,0,0,.2) 22px);background-attachment:fixed}
.wrap{max-width:470px;margin:0 auto;position:relative;z-index:1}
.osw{font-family:Oswald,'Arial Narrow',sans-serif}
button{font-family:inherit}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:8px}
.brand{font:600 15px Oswald,sans-serif;letter-spacing:.22em;color:var(--gold)}
.icon-btn{height:40px;min-width:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:500 12px Oswald,sans-serif;letter-spacing:.14em;cursor:pointer;display:flex;align-items:center;gap:6px}
/* вывеска */
.marquee{position:relative;border-radius:14px;background:#1c0a0e;padding:22px 18px 20px;box-shadow:0 0 0 3px var(--gold),0 0 44px rgba(232,176,74,.25)}
.bulbs{position:absolute;pointer-events:none;background-image:radial-gradient(circle,#ffe1a0 2.5px,rgba(255,225,160,.25) 3.5px,transparent 4.5px)}
.bulbs.x{left:10px;right:10px;height:8px;background-size:16px 8px;background-repeat:repeat-x}
.bulbs.y{top:10px;bottom:10px;width:8px;background-size:8px 16px;background-repeat:repeat-y}
.bulbs.chase{animation:chase 1.4s steps(1) infinite;opacity:.0}
.bulbs.x.chase{background-position:8px 0}.bulbs.y.chase{background-position:0 8px}
@keyframes chase{50%{opacity:1}}
.mq-k{margin:2px 0;text-align:center;font:500 12px Oswald,sans-serif;letter-spacing:.32em;color:var(--gold)}
.mq-t{margin:0;text-align:center;font:700 42px/1 Oswald,sans-serif;letter-spacing:.03em;color:#fff3da;text-shadow:0 0 18px rgba(255,210,122,.45)}
.mq-s{margin:8px 0 0;text-align:center;font-style:italic;font-size:14px;color:var(--soft)}
.label{margin:22px 0 10px;font:500 13px Oswald,sans-serif;letter-spacing:.22em;color:var(--gold)}
/* доска с буквами */
.board{border-radius:12px;padding:12px 14px;background-color:var(--board);background-image:repeating-linear-gradient(180deg,#151112 0,#151112 9px,#0c0a0b 10px);box-shadow:inset 0 0 0 6px #2a1a14,inset 0 0 0 7px #5a3b26}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10px;padding:6px 4px}
.lb{display:flex;align-items:center;gap:10px;min-height:46px;background:none;border:0;padding:0;color:#e9e2d6;font:500 19px Oswald,sans-serif;letter-spacing:.06em;cursor:pointer;text-align:left}
.lb i{font-style:normal;font-size:12px;color:#8f857a;width:18px}
.lb.on{color:var(--gold2);font-weight:600;text-shadow:0 0 12px rgba(255,210,122,.35)}
.lb.on i{color:var(--gold)}
/* билетики-настройки */
.stubs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stub{border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px}
.stub .k{font:500 11px Oswald,sans-serif;letter-spacing:.18em;color:var(--mute)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{border:1px solid #6b4430;background:transparent;color:var(--ink);border-radius:8px;padding:0 10px;min-height:36px;font:700 14px 'PT Serif',serif;cursor:pointer}
.opt.on{background:var(--gold);color:var(--dark);border-color:var(--gold)}
.wxrow{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:block;width:100%;border:0;border-radius:12px;height:58px;font:700 18px Oswald,sans-serif;letter-spacing:.16em;cursor:pointer;margin-top:14px;text-align:center}
.btn.main{background:var(--gold);color:var(--dark);box-shadow:0 0 0 4px var(--vel),0 0 0 5px var(--gold)}
.btn.main:disabled{opacity:.35}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);height:50px;font-size:15px}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:500 14px Oswald,sans-serif;letter-spacing:.12em;cursor:pointer}
/* афиша */
.poster{margin:0 10px;border-radius:6px;overflow:hidden;background:var(--paper);color:var(--dark)}
.poster svg{display:block;width:100%;height:190px}
.poster .pt{padding:12px 14px 14px;text-align:center}
.poster .pk{margin:0;font:500 11px Oswald,sans-serif;letter-spacing:.28em;color:#8a3a22}
.poster h2{margin:4px 0;font:700 40px/1 Oswald,sans-serif;letter-spacing:.03em;text-transform:uppercase}
.poster .po{margin:0 0 6px;font-style:italic;font-size:12.5px;color:#7a4a3a}
.poster .pd{margin:0;font-style:italic;font-size:14px;line-height:1.45;color:#4b2a22}
.poster .pm{margin:8px 0 0;font:500 12px Oswald,sans-serif;letter-spacing:.12em;color:#8a3a22}
/* буфет */
.buf-t{margin:4px 0 6px;text-align:center;font:500 13px Oswald,sans-serif;letter-spacing:.34em;color:var(--gold)}
.ctxn{text-align:center;font-style:italic;font-size:12.5px;color:#b9a58c;margin-bottom:6px}
.course{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #2a2224}
.course:last-child{border-bottom:0}
.course .ct{flex:1;min-width:0}
.course .k{font:500 10.5px Oswald,sans-serif;letter-spacing:.2em;color:#8f857a}
.course .n{font:500 19px/1.15 Oswald,sans-serif;letter-spacing:.05em;color:#f4efe6;text-transform:uppercase}
.course .m{font:500 12px Oswald,sans-serif;letter-spacing:.1em;color:var(--mute);margin-top:2px}
.course .w{font-style:italic;font-size:12.5px;color:#b9a58c;margin-top:3px;line-height:1.35}
.re{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid #4a3a30;background:transparent;color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:center}
/* программка (вкладки) */
.prog{margin-top:14px;background:var(--paper);color:var(--dark);border-radius:10px;overflow:hidden}
.tabs{display:flex;border-bottom:1.5px dashed #c9a87c}
.tabs button{flex:1;background:none;border:0;padding:12px 4px;font:500 13px Oswald,sans-serif;letter-spacing:.14em;color:#8a6a55;cursor:pointer;min-height:44px}
.tabs button.on{color:var(--dark);background:#ead4ad}
.pane{padding:14px 16px 16px}
.how p{margin:0 0 10px;font-size:14.5px;line-height:1.55}
.how b{font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.05em;color:#8a3a22;text-transform:uppercase;font-size:14px}
.shop-group{margin-bottom:12px}
.shop-group h4{margin:0 0 4px;font:600 12px Oswald,sans-serif;letter-spacing:.16em;color:#8a3a22;text-transform:uppercase}
.shop-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted #c9a87c;font-size:15px;cursor:pointer}
.shop-item .box{width:22px;height:22px;border-radius:5px;border:2px solid #8a6a55;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--paper)}
.shop-item.done .box{background:#8a3a22;border-color:#8a3a22}
.shop-item.done .t{text-decoration:line-through;color:#9a8270}
.shop-item .q{margin-left:auto;color:#7a5a48;font-size:13px;white-space:nowrap}
.pbtn{display:block;width:100%;margin-top:8px;height:46px;border-radius:10px;border:1.5px solid #8a3a22;background:transparent;color:#8a3a22;font:500 14px Oswald,sans-serif;letter-spacing:.14em;cursor:pointer}
.order-link{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;background:#ead4ad;text-decoration:none;color:var(--dark);margin-bottom:8px}
.order-link b{display:block;font:600 14px Oswald,sans-serif;letter-spacing:.06em}
.order-link small{color:#7a5a48;font-size:12px}
.order-link .arr{margin-left:auto;color:#8a3a22;font-weight:700}
.osub{font:600 11px Oswald,sans-serif;letter-spacing:.18em;color:#8a3a22;margin:4px 0 8px}
.note{font-size:12px;color:#7a5a48;line-height:1.45;margin-top:8px;font-style:italic}
.empty{color:#8a6a55;text-align:center;padding:20px 10px;font-style:italic}
/* архив */
.ticket{display:flex;background:var(--paper);color:var(--dark);border-radius:10px;overflow:hidden;margin-bottom:10px}
.ticket .tb{flex:1;padding:12px 14px}
.ticket .tn{font:600 18px Oswald,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.ticket .ts{font-size:13px;color:#6b4a3a;margin-top:3px;font-style:italic}
.ticket .tside{width:70px;border-left:2px dashed #c9a87c;background:#ead4ad;display:flex;align-items:center;justify-content:center;text-align:center;font:500 11px Oswald,sans-serif;letter-spacing:.12em;color:#8a3a22;padding:6px}
.back{background:none;border:0;color:var(--gold);font:500 13px Oswald,sans-serif;letter-spacing:.16em;padding:0;min-height:44px;cursor:pointer;display:flex;align-items:center;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);background:var(--gold);color:var(--dark);padding:12px 18px;border-radius:10px;font:600 14px Oswald,sans-serif;letter-spacing:.08em;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.drop{position:absolute;top:-12%;width:1.5px;height:64px;background:linear-gradient(transparent,rgba(255,225,190,.45));animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,0) rotate(12deg)}to{transform:translate(-110px,125vh) rotate(12deg)}}
.flake{position:absolute;top:-6%;border-radius:50%;background:rgba(255,245,230,.9);animation:snow linear infinite}
@keyframes snow{0%{transform:translate(0,0)}50%{transform:translate(28px,55vh)}100%{transform:translate(-10px,112vh)}}
.sunglow{position:absolute;right:-140px;top:-160px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,120,.22),transparent 65%);animation:pulse 7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
.cloud{position:absolute;height:130px;border-radius:50%;background:rgba(255,220,200,.08);filter:blur(34px);animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-110%)}to{transform:translateX(150vw)}}
.fogband{position:absolute;left:-50%;width:200%;height:200px;background:linear-gradient(transparent,rgba(255,230,210,.1),transparent);filter:blur(12px);animation:fogm ease-in-out infinite alternate}
@keyframes fogm{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.star{display:none}
@media (prefers-reduced-motion:reduce){#fx *,.bulbs.chase{animation:none!important}}

.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mp{border:0;padding:5px;border-radius:7px;background:transparent;cursor:pointer;opacity:.72;transition:transform .2s,opacity .2s,box-shadow .2s}
.mp .pc{display:block;border-radius:3px;overflow:hidden}
.mp svg{display:block;width:100%;height:auto;aspect-ratio:100/92}
.mp .pl{display:block;padding:6px 2px 7px;text-align:center;font:600 13px Oswald,sans-serif;letter-spacing:.05em}
.mp.on{opacity:1;background-color:#1c0a0e;background-image:radial-gradient(circle,#ffe1a0 1.6px,transparent 2.4px);background-size:9px 9px;box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(232,176,74,.45);transform:translateY(-2px)}
.mp.on .pl{font-weight:700}
.mp:active{transform:scale(.97)}
.hk{margin:0;font:500 12px Oswald,sans-serif;letter-spacing:.32em;color:var(--gold)}
.hh{margin:2px 0 0;font:700 34px/1.05 Oswald,sans-serif;letter-spacing:.03em;color:#fff3da}
.hs{margin:4px 0 16px;font-style:italic;font-size:14px;color:var(--soft)}
.sur{display:block;width:100%;height:46px;margin-top:14px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:500 14px Oswald,sans-serif;letter-spacing:.14em;cursor:pointer}

#curtain{position:fixed;inset:0;z-index:20;display:none;overflow:hidden}
#curtain.show{display:block}
#curtain .cdim{position:absolute;inset:0;background:#070304;opacity:0;transition:opacity .45s ease}
#curtain.dark .cdim{opacity:.92}
#curtain .cl,#curtain .cr{position:absolute;top:0;bottom:0;width:52%;transition:transform .75s cubic-bezier(.65,0,.25,1);background-color:#6a1222;background-image:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,0) 30%,rgba(0,0,0,.35)),repeating-linear-gradient(90deg,#4a0a15 0,#7d1828 12px,#9a2234 18px,#6a1222 26px,#4a0a15 36px);box-shadow:0 0 40px rgba(0,0,0,.6)}
#curtain .cl{left:0;transform:translateX(-102%)}
#curtain .cr{right:0;transform:translateX(102%)}
#curtain.closed .cl,#curtain.closed .cr{transform:none}
#curtain.opening .cl{transform:translateX(-102%);transition-duration:1.1s}
#curtain.opening .cr{transform:translateX(102%);transition-duration:1.1s}
#curtain .cl:after,#curtain .cr:after{content:'';position:absolute;left:0;right:0;bottom:0;height:14px;background:repeating-linear-gradient(90deg,#e8b04a 0,#e8b04a 4px,#b07a24 4px,#b07a24 8px);opacity:.9}
#curtain .val{position:absolute;left:0;right:0;top:0;height:64px;z-index:2;background-color:#5a0f1c;background-image:repeating-linear-gradient(90deg,#4a0a15 0,#7d1828 20px,#4a0a15 40px);border-bottom:6px solid #e8b04a;box-shadow:0 8px 20px rgba(0,0,0,.5);transform:translateY(-110%);transition:transform .5s ease}
#curtain.dark .val{transform:none}
#curtain .lead{position:absolute;left:50%;top:50%;width:190px;height:190px;margin:-95px 0 0 -95px;z-index:3;border-radius:50%;opacity:0;transform:scale(.85);transition:opacity .25s,transform .25s;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#f3e2c2 0 58%,transparent 59%),conic-gradient(from 0deg,rgba(43,11,18,.0) 0deg,rgba(43,11,18,.0) var(--sw,0deg),#f3e2c2 var(--sw,0deg));box-shadow:0 0 0 6px #e8b04a,0 0 0 9px #2b0b12,0 0 60px rgba(255,210,122,.4)}
#curtain.count .lead{opacity:1;transform:none}
#curtain .lead:before,#curtain .lead:after{content:'';position:absolute;background:#2b0b12;opacity:.5}
#curtain .lead:before{left:50%;top:6px;bottom:6px;width:2px;margin-left:-1px}
#curtain .lead:after{top:50%;left:6px;right:6px;height:2px;margin-top:-1px}
#curtain .num{position:relative;z-index:1;font:700 96px/1 Oswald,sans-serif;color:#2b0b12}
#curtain .cap{position:absolute;left:0;right:0;top:calc(50% + 120px);z-index:3;text-align:center;font:500 13px Oswald,sans-serif;letter-spacing:.34em;color:#ffd27a;opacity:0;transition:opacity .3s}
#curtain.count .cap{opacity:1}
#curtain .skip{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:4;background:rgba(0,0,0,.35);border:1px solid rgba(232,176,74,.5);color:#ffd27a;border-radius:10px;height:40px;padding:0 14px;font:500 12px Oswald,sans-serif;letter-spacing:.16em;cursor:pointer}

.poster{position:relative}
.marquee.rw,.marquee.rv{overflow:hidden}
.marquee.rw .poster{animation:rwOut .48s cubic-bezier(.5,0,.9,.4) forwards}
@keyframes rwOut{0%{transform:none;filter:none}20%{filter:brightness(1.7) contrast(1.2)}35%{filter:brightness(.7)}55%{filter:brightness(1.5) blur(1px)}100%{transform:translateY(-40%) scaleY(1.05);filter:brightness(.15) blur(4px);opacity:.15}}
.marquee.rv .poster{animation:rvIn .6s cubic-bezier(.2,.7,.3,1)}
@keyframes rvIn{0%{transform:translateY(40%);filter:brightness(1.9) blur(4px);opacity:.2}35%{filter:brightness(1.4) blur(1px);opacity:1}50%{filter:brightness(.75)}65%{filter:brightness(1.25)}80%{filter:brightness(.92)}100%{transform:none;filter:none;opacity:1}}
.flick{position:absolute;inset:14px 24px;z-index:5;pointer-events:none;border-radius:6px;opacity:0;mix-blend-mode:screen;
 background:repeating-linear-gradient(90deg,transparent 0 37px,rgba(255,240,210,.14) 38px 39px,transparent 40px 91px,rgba(255,240,210,.1) 92px 93px),radial-gradient(ellipse at 50% 50%,rgba(255,235,190,.35),transparent 70%)}
.marquee.rw .flick,.marquee.rv .flick{animation:flk .09s steps(2) infinite,flkfade .6s ease forwards}
@keyframes flk{0%{transform:translateX(0)}50%{transform:translateX(9px)}}
@keyframes flkfade{0%{opacity:.9}100%{opacity:0}}
.sprk{position:absolute;top:0;bottom:0;width:10px;z-index:6;pointer-events:none;opacity:0;background:repeating-linear-gradient(180deg,#0c0708 0 8px,#f3e2c2 8px 14px)}
.sprk.l{left:16px}.sprk.r{right:16px}
.marquee.rw .sprk,.marquee.rv .sprk{opacity:.85;animation:sprk .12s linear infinite}
@keyframes sprk{to{background-position:0 14px}}

.prog-strip{display:flex;gap:4px;margin:4px 0 18px;padding:6px 6px;background:#120c0c;border-radius:4px;background-image:radial-gradient(circle,#3a0e18 2px,transparent 2.5px),radial-gradient(circle,#3a0e18 2px,transparent 2.5px);background-size:10px 6px,10px 6px;background-repeat:repeat-x;background-position:2px 0,2px 100%}
.prog-strip i{flex:1;height:14px;border-radius:2px;background:#3b2a22}
.prog-strip i.on{background:var(--gold);box-shadow:0 0 8px rgba(255,210,122,.5)}
.qcard{position:relative;border-radius:14px;background:#1c0a0e;padding:22px 18px 20px;box-shadow:0 0 0 3px var(--gold),0 0 44px rgba(232,176,74,.2)}
.qn{font:500 12px Oswald,sans-serif;letter-spacing:.3em;color:var(--gold);margin:4px 0 6px;text-align:center}
.qq{margin:0;text-align:center;font:700 28px/1.12 Oswald,sans-serif;letter-spacing:.02em;color:#fff3da}
.qh{margin:8px 0 0;text-align:center;font-style:italic;font-size:13.5px;color:var(--soft)}
.qopts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.qo{position:relative;display:flex;align-items:center;gap:12px;min-height:62px;padding:12px 16px 12px 18px;border:0;border-radius:8px;background:var(--paper);color:var(--dark);cursor:pointer;text-align:left;font:400 16px/1.3 'PT Serif',serif;transition:transform .15s}
.qo:before,.qo:after{content:'';position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--vel)}
.qo:before{left:-7px}.qo:after{right:-7px}
.qo b{font:700 13px Oswald,sans-serif;color:#8a3a22;letter-spacing:.1em;width:20px;flex:none}
.qo:active{transform:scale(.98)}
.qo.on{background:var(--gold);box-shadow:0 0 18px rgba(255,210,122,.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
.qnote{font-size:11.5px;color:#a8927d;font-style:italic;text-align:center;margin-top:14px;line-height:1.45}
.abon{position:relative;display:flex;background:var(--paper);color:var(--dark);border-radius:10px;overflow:hidden;margin-bottom:12px}
.abon .ab{flex:1;padding:14px 16px}
.abon .ak{font:500 10.5px Oswald,sans-serif;letter-spacing:.24em;color:#8a3a22}
.abon .an{font:700 22px/1.1 Oswald,sans-serif;letter-spacing:.03em;margin:4px 0 2px;text-transform:uppercase}
.abon .af{font-style:italic;font-size:13px;color:#6b4a3a}
.abon .side{width:62px;border-left:2px dashed #c9a87c;background:#ead4ad;display:flex;align-items:center;justify-content:center}
.abon .side span{writing-mode:vertical-rl;transform:rotate(180deg);font:600 11px Oswald,sans-serif;letter-spacing:.2em;color:#8a3a22}

 if(w==='snow')h=Array.from({length:45},()=>{const s=R(3,8);return `<i class="flake" style="left:${R(-5,100)}%;width:${s}px;height:${s}px;animation-duration:${R(7,16)}s;animation-delay:-${R(0,16)}s;opacity:${R(.5,1)}"></i>`}).join('');
 if(w==='sun')h=`<div class="sunglow"></div>`;
 if(w==='cloud')h=[0,1,2,3].map(i=>`<div class="cloud" style="top:${R(-5,60)}%;width:${R(260,420)}px;animation-duration:${R(45,80)}s;animation-delay:-${R(0,60)}s"></div>`).join('');
 if(w==='fog')h=[0,1,2].map(i=>`<div class="fogband" style="top:${20+i*28}%;animation-duration:${R(18,30)}s"></div>`).join('');
 if(dark&&(w==='none'||w==='sun'))h+=Array.from({length:40},()=>`<i class="star" style="left:${R(0,100)}%;top:${R(0,60)}%;animation-duration:${R(2,5)}s;animation-delay:-${R(0,5)}s;opacity:${R(.3,.9)}"></i>`).join('');

}

 if(kind==='f'||kind==='d'){

  if(c.season==='summer'){if(x.c.includes('light')||x.c.includes('mediterranean'))b+=2;if(x.id==='icecream')b+=3}
  if(c.season==='spring'&&x.c.includes('light'))b+=1;
  if(weather==='rain'||weather==='snow'||weather==='fog'){if(x.c.includes('comfort'))b+=2}
  if(c.tod==='night'&&kind==='f'){if(x.cook&&x.cook>25&&cooking())b-=5;if(!x.cook||x.cook<=20)b+=1}
 }
 if(kind==='r'){
  if(c.season==='winter'||c.season==='autumn'||weather==='rain'||weather==='snow'){if(hot.includes(x.id))b+=3;if(['lemonade','mojito','mojito0','aperol','cola'].includes(x.id))b-=2}
  if(c.season==='summer'&&weather!=='rain'){if(cold.includes(x.id))b+=3;if(['mulled','mulled0','cocoa','masala'].includes(x.id))b-=5}
  if(c.season==='spring'&&['prosecco','rose','matcha','lemonade','nzero'].includes(x.id))b+=2;
 }
 if(kind==='m'){if((weather==='rain'||weather==='snow')&&x.m.includes('cozy'))b+=2;if(c.tod==='night'&&x.r>140)b-=3}
 return b;
}

function profMovie(m){const p=P();if(!p)return 0;let b=0;const has=x=>m.m.includes(x);
 if(has('thrill')||has('action'))b+=6*(p.thrill-.5);
 if(m.g==='ужасы')b+=p.dark<.3?-9:6*(p.dark-.5);
 if(has('deep'))b+=6*(p.cerebral-.5);
 const foreign=m.o&&!m.c.includes('american')&&!m.c.includes('russian')&&!m.c.includes('georgian');if(foreign)b+=6*(p.aesthetic-.5);
 if(has('touching'))b+=6*(p.touching-.5);
 if(has('romance')||has('fun'))b+=5*(p.communal-.5);
 if(has('nostalgia')||m.y<1990)b+=6*(p.nostalgia-.5);
 return b}
function profFood(key,x){const p=P();if(!p||key==='r')return 0;let b=0;
 if(x.c.some(c=>EXOTIC.includes(c)))b+=p.neo<.35?-4:p.neo>.7?2:0;
 if(SPICY.includes(x.id))b+=p.spicy<.25?-10:p.spicy>.75?3:0;
 if(key==='f'&&x.cook&&cooking()){b+=p.cook<.3&&x.cook>25?-3:0}
 return b}

 const top=Object.keys(m).sort((a,b)=>(p[b]+(b==='thrill'?p.dark*.3:0))-(p[a]+(a==='thrill'?p.dark*.3:0)))[0];
 const food=p.neo>.65?'гастро-исследователь':p.neo<.35?'верен проверенным блюдам':'открыт новому без фанатизма';
 return {n:m[top][0],d:m[top][1],food}}

let cur={timers:[],cb:null,raf:0};
function skipCurtain(){cur.timers.forEach(clearTimeout);cancelAnimationFrame(cur.raf);const el=document.getElementById('curtain');if(cur.cb){const c=cur.cb;cur.cb=null;c()}el.className='show';requestAnimationFrame(()=>{el.className='show opening'});setTimeout(()=>{el.className=''},700)}
function playCurtain(cb){
 const el=document.getElementById('curtain');
 let reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
 if(reduce||!el){cb();return}
 cur.cb=cb;cur.timers=[];const T=(fn,ms)=>cur.timers.push(setTimeout(fn,ms));
 const lead=el.querySelector('.lead'),num=el.querySelector('.num');
 el.className='show';
 requestAnimationFrame(()=>{el.className='show dark'});
 T(()=>{el.className='show dark closed'},350);
 T(()=>{el.className='show dark closed count';let n=3;num.textContent=n;const t0=performance.now();
   const tick=(now)=>{const p=((now-t0)%420)/420;lead.style.setProperty('--sw',(p*360)+'deg');const k=3-Math.floor((now-t0)/420);if(k>=1&&num.textContent!=String(k))num.textContent=k;if(now-t0<1260)cur.raf=requestAnimationFrame(tick)};cur.raf=requestAnimationFrame(tick)},1050);
 T(()=>{if(cur.cb){const c=cur.cb;cur.cb=null;c()}el.className='show dark closed';},2330);
 T(()=>{el.className='show opening'},2480);
 T(()=>{el.className=''},3650);
}

function pickMovie(){
 const maxR=S.time==='short'?105:S.time==='mid'?135:999;
 const base=m=>m.r<=maxR&&(S.who!=='kids'||m.k)&&!seen.has(m.t)&&m.m.some(x=>S.moods.includes(x));
 let pool=MOVIES.filter(m=>base(m)&&!S.shown.m.has(m.t));
 if(!pool.length){S.shown.m.clear();pool=MOVIES.filter(base)}
 if(!pool.length)return null;
 const sc=pool.map(m=>{let s=overlap(m.m,S.moods)*10+Math.random()*7+ctxBoost('m',m)+profMovie(m);if(S.who==='friends'&&(m.m.includes('fun')||m.m.includes('action')))s+=2;if(S.who==='pair'&&m.m.includes('romance'))s+=1;return{m,s}}).sort((a,b)=>b.s-a.s);
 const mv=sc[0].m;S.shown.m.add(mv.t);return mv;
}
function pickFrom(list,key,okFn,favId,favKey,extra){
 const mv=S.movie;
 let pool=list.filter(x=>okFn(x)&&!S.shown[key].has(x.id));
 if(!pool.length){S.shown[key].clear();pool=list.filter(okFn)}
 const sc=pool.map(x=>{let s=overlap(x.c,mv.c)*4+(x.m?overlap(x.m,S.moods)*2:0)+Math.random()*3+(extra?extra(x):0)+ctxBoost(key,x)+profFood(key,x);if(!S.fav[favKey]&&favId===x.id)s+=50;return{x,s}}).sort((a,b)=>b.s-a.s);
 const it=sc[0].x;S.shown[key].add(it.id);
 let why;
 if(!S.fav[favKey]&&favId===it.id){why=favKey==='f'?mv.fn:favKey==='r'?mv.drn:mv.dn;S.fav[favKey]=true}
 else{const cm=mv.c.find(c=>it.c.includes(c));if(cm)why=whyFor(key,cm);else{const md=it.m&&S.moods.find(x=>it.m.includes(x));why=md?'Под настроение «'+MOODS[md].n.toLowerCase()+'».':'Хорошо ложится к этому вечеру.'}}
 return{...it,why};
}

function pickDess(){
 const ok=d=>S.food==='cook'?(d.cook>0||d.buy):S.food==='order'?(d.ord||d.buy):true;

function rResult(){
 const m=S.movie;
 const tabs=[['recipe','ПОДАЧА'],['shop','ПРОДУКТЫ'],['order','ЗАКАЗ']];
 app.innerHTML=header()+`<div class="fade">
 <button class="back" onclick="go('home')">${IC.back} ПРОГРАММА</button>
 <div class="marquee" style="padding:14px">${bulbsY()}<div class="flick"></div><div class="sprk l"></div><div class="sprk r"></div>
  <div class="poster">${posterArt(m)}<div class="pt"><p class="pk">${m.y} · ${fmtTime(m.r).toUpperCase()} · ${m.g.toUpperCase()}</p><h2 style="font-size:${Math.min(40,Math.floor(265/(Math.max(...m.t.split(/\s+/).map(w=>w.length))*0.7)))}px;overflow-wrap:anywhere">${m.t}</h2>${m.o?`<p class="po">${m.o}</p>`:''}<p class="pd">${m.d}</p><p class="pm">ПОД ВАШЕ: ${m.m.filter(x=>S.moods.includes(x)).map(x=>MB[x]).join(' + ')}${m.k?' · СЕМЕЙНЫЙ':''}</p></div></div>
 </div>
 <div class="row"><button onclick="nextMovie()">ДРУГОЙ ФИЛЬМ</button><button onclick="markSeen()">УЖЕ ВИДЕЛИ</button></div>
 <div class="board" style="margin-top:16px"><p class="buf-t">— БУФЕТ НА ДВОИХ —</p><div class="ctxn">${ctxWhy()}</div>
  ${course('f','ОСНОВНОЕ',S.main,mainMeta(S.main))}
  ${course('d','ДЕСЕРТ',S.dess,dessMeta(S.dess))}
  ${course('r','БАР',S.drk,S.drk.a?'С ГРАДУСОМ':'БЕЗ АЛКОГОЛЯ')}
 </div>
 <div class="prog"><div class="tabs">${tabs.map(([k,n])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';rResult()">${n}</button>`).join('')}</div><div class="pane">${rPane()}</div></div>
 <button class="btn main" onclick="accept()">БЕРЁМ БИЛЕТЫ</button>
 <button class="btn ghost" onclick="share()">СКОПИРОВАТЬ ПРОГРАММУ</button></div>`;
}
function re(k){S.checked.clear();if(k==='f'){S.main=pickMain()}else if(k==='d'){S.dess=pickDess()}else{S.drk=pickDrink()}rResult()}
let rewinding=false;
function nextMovie(){
 if(rewinding)return;
 const n=pickMovie();if(!n){toast('Фильмы под этот запрос закончились');return}
 const swap=()=>{S.movie=n;['f','d','r'].forEach(k=>S.shown[k].clear());newMenu();rResult()};
 let reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
 const mq=document.querySelector('#app .marquee');
 if(reduce||!mq){swap();window.scrollTo({top:0,behavior:'smooth'});return}
 rewinding=true;window.scrollTo({top:0,behavior:'smooth'});
 try{navigator.vibrate&&navigator.vibrate([8,40,8,40,8])}catch(e){}
 mq.classList.add('rw');
 setTimeout(()=>{swap();const m2=document.querySelector('#app .marquee');if(m2){m2.classList.add('rv');setTimeout(()=>{m2.classList.remove('rv');rewinding=false},650)}else rewinding=false},480);
}
function markSeen(){seen.add(S.movie.t);store.set('kv_seen',[...seen]);toast('Запомнили — больше не предложим');nextMovie()}
function planText(){return `Сегодня в программе: ${S.movie.t} (${S.movie.y}, ${fmtTime(S.movie.r)})\nУжин: ${S.main.n}\nДесерт: ${S.dess.n}\nБар: ${S.drk.n}`}
function accept(){hist.unshift({d:new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'}),m:S.movie.t,me:S.movie.e,f:S.main.n,fe:S.main.e,ds:S.dess.n,dr:S.drk.n,dre:S.drk.e});hist=hist.slice(0,50);seen.add(S.movie.t);store.set('kv_seen',[...seen]);store.set('kv_hist',hist);toast('Приятного просмотра и аппетита!');setTimeout(()=>go('history'),900)}
async function share(){try{await navigator.clipboard.writeText(planText());toast('Скопировано — отправьте в чат')}catch(e){toast('Не получилось скопировать')}}
function reset(){S.moods=[];go('home')}
function rHistory(){
 app.innerHTML=header()+`<div class="fade"><button class="back" onclick="go(S.movie?'result':'home')">${IC.back} НАЗАД</button>
 <div class="marquee">${bulbs()}<p class="mq-k">ВАШИ</p><h1 class="mq-t" style="font-size:36px">ПРОШЛЫЕ СЕАНСЫ</h1></div>
 <div style="margin-top:16px">${hist.length?hist.map(x=>`<div class="ticket"><div class="tb"><div class="tn">${x.m}</div><div class="ts">${x.f}${x.ds?' · '+x.ds:''}${x.dr?' · '+x.dr:''}</div></div><div class="tside">${x.d.toUpperCase()}</div></div>`).join(''):'<div class="ticket"><div class="tb"><div class="empty" style="color:#6b4a3a">Пока ни одного сеанса. Самое время начать.</div></div></div>'}</div>
 ${seen.size?`<button class="btn ghost" onclick="clearSeen()">СНОВА ПРЕДЛАГАТЬ ПРОСМОТРЕННЫЕ (${seen.size})</button>`:''}
 <button class="btn main" onclick="reset()">НОВЫЙ СЕАНС</button></div>`;
}
function clearSeen(){seen.clear();store.set('kv_seen',[]);toast('Готово');rHistory()}
function go(s){S.screen=s;({home:rHome,details:rDetails,result:rResult,history:rHistory,theme:rTheme,quiz:rQuiz,quizIntro:rQuizIntro,profile:rProfile})[s]();window.scrollTo(0,0)}
applyTheme(theme);applyProfDefaults();go(!profs.length&&!store.get('kv_quiz_skip',0)?'quizIntro':'home');setInterval(()=>{if(theme==='auto'){const r=resolvedTheme();if(document.documentElement.getAttribute('data-theme')!==r)applyTheme('auto')}},60000);

/* ===== PWA ===== */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
(function(){try{const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const sa=window.navigator.standalone||window.matchMedia('(display-mode: standalone)').matches;if(ios&&!sa&&!localStorage.getItem('kv_ihint')){const d=document.createElement('div');d.className='ihint';d.innerHTML='<b>Установите как приложение:</b> нажмите «Поделиться» внизу Safari → «На экран „Домой“». Откроется на весь экран и с иконкой.<button aria-label="Закрыть">×</button>';d.querySelector('button').onclick=()=>{d.remove();try{localStorage.setItem('kv_ihint','1')}catch(e){}};document.body.appendChild(d)}}catch(e){}})();
</script>
</body>
</html>
